  }

  const entTxt = `${ent.toFixed(3)} bits/byte`;
  if (ext && TEXT_EXTS.includes(ext) && ent > 7.2) add('Entropy', 'warn', `${entTxt} is very high for a text file. It may be encrypted, compressed or packed.`);
  else add('Entropy', 'info', `${entTxt}. ${ent > 7.5 ? 'Typical of compressed or encrypted data.' : ent < 4 ? 'Low: structured or repetitive content.' : 'Moderate.'}`);

  const status = checks.some(c => c.status === 'fail') ? 'fail' : checks.some(c => c.status === 'warn') ? 'warn' : 'pass';
  return { status, checks, ext, header };
}


function readExif(file) {
  return new Promise(async resolve => {
    try {
      await needExif();
      const t = setTimeout(() => resolve({}), 4000);
      const ok = EXIF.getData(file, function () { clearTimeout(t); resolve(EXIF.getAllTags(this) || {}); });
      if (ok === false) { clearTimeout(t); resolve({}); }
    } catch { resolve({}); }
  });
}
function exifValue(v) {
  if (v == null) return '';
  if (Array.isArray(v) || (v && v.length !== undefined && typeof v !== 'string')) {
    const a = [...v]; if (a.length > 8) return `[${a.length} values]`;
    return a.map(exifValue).join(', ');
  }
  if (typeof v === 'object') { if ('numerator' in v && 'denominator' in v) return v.denominator ? String(+(v.numerator / v.denominator).toFixed(4)) : String(v.numerator); return JSON.stringify(v); }
  return String(v);
}
function exifRows(tags) {
  const skip = new Set(['MakerNote', 'UserComment', 'thumbnail', 'PrintIM', 'ComponentsConfiguration', 'FileSource', 'SceneType', 'ExifVersion', 'FlashpixVersion']);
  const pri = ['Make','Model','Software','DateTime','DateTimeOriginal','DateTimeDigitized','Artist','Copyright','ExposureTime','FNumber','ISOSpeedRatings','FocalLength','Flash','Orientation','PixelXDimension','PixelYDimension','GPSLatitude','GPSLongitude'];
  const rows = [];
  const keys = Object.keys(tags).filter(k => !skip.has(k));
  keys.sort((a, b) => { const ia = pri.indexOf(a), ib = pri.indexOf(b); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b); });
  for (const k of keys) {
    let val = exifValue(tags[k]);
    if ((k === 'GPSLatitude' || k === 'GPSLongitude') && Array.isArray(tags[k]) && tags[k].length === 3) {
      const d = tags[k].map(Number); let dec = d[0] + d[1] / 60 + d[2] / 3600;
      const ref = tags[k === 'GPSLatitude' ? 'GPSLatitudeRef' : 'GPSLongitudeRef'];
      if (ref === 'S' || ref === 'W') dec = -dec;
      val = `${dec.toFixed(6)}° (${val})`;
    }
    if (val !== '') rows.push([k, val]);
  }
  return rows;
}


const state = { last: null };


const VIEWS = ['analyzer', 'register', 'verify', 'history'];
function show(view, updateHash = true) {
  if (!VIEWS.includes(view)) view = 'analyzer';
  VIEWS.forEach(v => $('#view-' + v).classList.toggle('hidden', v !== view));
  $$('[data-nav]').forEach(b => { const on = b.dataset.nav === view; b.classList.toggle('active', on); b.setAttribute('aria-current', on ? 'page' : 'false'); });
  if (view !== 'verify') stopCamera();
  if (view === 'history') renderHistory();
  if (view === 'register') updateLastHint();
  if (updateHash) history.replaceState(null, '', '#' + view);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
$$('[data-nav]').forEach(b => b.addEventListener('click', () => show(b.dataset.nav)));
window.addEventListener('hashchange', () => show(location.hash.slice(1), false));


function wireDrop(zone, input, handler) {
  ['dragenter', 'dragover'].forEach(ev => zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.add('drag-over'); }));
  ['dragleave', 'drop'].forEach(ev => zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.remove('drag-over'); }));
  zone.addEventListener('drop', e => { const f = e.dataTransfer?.files?.[0]; if (f) handler(f); });
  input.addEventListener('change', () => { const f = input.files[0]; if (f) handler(f); input.value = ''; });
}

['dragover', 'drop'].forEach(ev => window.addEventListener(ev, e => e.preventDefault()));



function setProgress(p, label) {
  $('#progress-wrap').classList.remove('hidden');
  const pct = Math.round(p * 100);
  $('#progress-bar').style.width = pct + '%';
  $('#progress-pct').textContent = pct + '%';
  if (label) $('#progress-label').textContent = label;
}
const hideProgress = () => $('#progress-wrap').classList.add('hidden');

async function analyzeFile(file) {
  $('#analysis-result').innerHTML = '';
  try {
    setProgress(0, `Reading ${file.name}…`);
    const buf = await readFile(file, p => setProgress(p * 0.8));
    const bytes = new Uint8Array(buf);
    setProgress(0.85, 'Computing SHA-256…'); await nextFrame();
    const sha256 = await sha256Hex(buf);
    setProgress(0.92, 'Computing MD5…'); await nextFrame();
    const md5 = md5Hex(bytes);
    setProgress(0.97, 'Running integrity checks…'); await nextFrame();
    const sig = detectSig(bytes);
    const ent = entropy(bytes);
    const integrity = integrityCheck(file.name, bytes, sig, ent);

    let exif = null;
    if (sig && sig.type === 'JPEG image') {
      exif = await readExif(file);
      const rows = exifRows(exif);
      const sw = String(exif.Software || '');
      if (!rows.length) integrity.checks.push({ label: 'EXIF metadata', status: 'info', detail: 'No EXIF data. It may have been stripped, or the image is a screenshot or export.' });
      else if (/photoshop|gimp|lightroom|snapseed|canva|pixlr|paint\.net|affinity|picsart/i.test(sw)) {
        integrity.checks.push({ label: 'EXIF Software tag', status: 'warn', detail: `Image was processed by "${sw}". It is not an untouched camera original.` });
        if (integrity.status === 'pass') integrity.status = 'warn';
      }
    }
    const analysis = {
      id: Date.now(), at: Date.now(), name: file.name, size: file.size, type: file.type || 'unknown',
      lastModified: file.lastModified, sha256, md5, detected: sig ? sig.type : 'No known signature',
      integrity, entropy: ent, exifRows: exif ? exifRows(exif) : null, isJpeg: !!(sig && sig.type === 'JPEG image')
    };
    state.last = { name: file.name, sha256, at: analysis.at };
    renderAnalysis(analysis, bytes);
    const sessions = store.get(KEYS.sessions, []);
    sessions.unshift({ id: analysis.id, at: analysis.at, name: file.name, size: file.size, sha256, md5, status: integrity.status, detected: analysis.detected });
    store.set(KEYS.sessions, sessions.slice(0, 100));
    setProgress(1, 'Done'); setTimeout(hideProgress, 500);
  } catch (err) {
    hideProgress();
    toast('Analysis failed: ' + (err.message || err), 'error');
  }
}

const STATUS_STYLE = {
  pass: { dot: 'bg-emerald-500/20 text-emerald-300', icon: '✓' },
  warn: { dot: 'bg-amber-500/20 text-amber-300', icon: '!' },
  fail: { dot: 'bg-rose-500/20 text-rose-300', icon: '✕' },
  info: { dot: 'bg-slate-600/40 text-slate-300', icon: 'i' }
};
function renderAnalysis(a, bytes) {
  const verdict = {
    pass: ['bg-emerald-500/15 text-emerald-300 ring-emerald-400/40', 'INTEGRITY CHECKS PASSED'],
    warn: ['bg-amber-500/15 text-amber-300 ring-amber-400/40', 'REVIEW RECOMMENDED'],
    fail: ['bg-rose-500/15 text-rose-300 ring-rose-400/40', 'ANOMALY DETECTED']
  }[a.integrity.status];
  const meta = [
    ['File name', a.name], ['Size', `${fmtSize(a.size)} (${a.size.toLocaleString()} bytes)`], ['MIME type (browser)', a.type],
    ['Detected content', a.detected], ['Last modified', fmtDT(a.lastModified)], ['File header (hex)', hex(bytes.slice(0, 16)).toUpperCase().replace(/(..)/g, '$1 ').trim() || '—']
  ];
  const hashCard = (label, val) => `
    <div class="rounded-xl border border-slate-700 bg-slate-900/60 p-4">
      <div class="flex items-center justify-between mb-1"><span class="label !mb-0">${label}</span>
        <button class="btn btn-ghost btn-sm" data-copy="${esc(val)}" type="button">Copy</button></div>
      <p class="font-mono text-xs break-all text-cyan-200">${esc(val)}</p>
    </div>`;
  $('#analysis-result').innerHTML = `
  <div class="space-y-6 fade-in">
    <div class="card flex flex-col sm:flex-row sm:items-center gap-4">
      <div class="min-w-0">
        <p class="label">Analysis complete</p>
        <p class="text-lg font-semibold truncate">${esc(a.name)}</p>
      </div>
      <span class="sm:ml-auto inline-flex items-center gap-2 rounded-full px-4 py-1.5 text-sm font-bold ring-1 ${verdict[0]}">${verdict[1]}</span>
    </div>

    <div class="grid md:grid-cols-2 gap-4">${hashCard('SHA-256', a.sha256)}${hashCard('MD5 (legacy checksum)', a.md5)}</div>

    <div class="grid lg:grid-cols-2 gap-6">
      <div class="card">
        <h3 class="font-semibold mb-3">File metadata</h3>
        <dl class="divide-y divide-slate-700/60 text-sm">
          ${meta.map(([k, v]) => `<div class="py-2 grid grid-cols-3 gap-3"><dt class="text-slate-400">${k}</dt><dd class="col-span-2 break-words ${k.includes('hex') ? 'font-mono text-xs' : ''}">${esc(v)}</dd></div>`).join('')}
        </dl>
      </div>
      <div class="card">
        <h3 class="font-semibold mb-3">Anomaly &amp; integrity checks</h3>
        <ul class="space-y-3">
          ${a.integrity.checks.map(c => `
            <li class="flex gap-3">
              <span class="h-6 w-6 shrink-0 rounded-full grid place-items-center text-xs font-bold ${STATUS_STYLE[c.status].dot}" aria-label="${c.status}">${STATUS_STYLE[c.status].icon}</span>
              <div class="text-sm"><p class="font-medium">${esc(c.label)}</p><p class="text-slate-400">${esc(c.detail)}</p></div>
            </li>`).join('')}
        </ul>
      </div>
    </div>

    <div class="card">
      <h3 class="font-semibold mb-3">EXIF metadata</h3>
      ${!a.isJpeg ? '<p class="text-sm text-slate-400">EXIF extraction applies to JPEG images. This file is not a JPEG.</p>'
        : !a.exifRows.length ? '<p class="text-sm text-slate-400">No EXIF tags found in this image.</p>'
        : `<div class="overflow-x-auto scroll-thin max-h-96"><table><thead><tr><th>Tag</th><th>Value</th></tr></thead><tbody>
            ${a.exifRows.map(([k, v]) => `<tr><td class="font-mono text-xs text-cyan-300 whitespace-nowrap">${esc(k)}</td><td class="break-all">${esc(v)}</td></tr>`).join('')}
          </tbody></table></div>`}
    </div>

    <div class="flex flex-wrap gap-3">
      <button id="act-register" class="btn btn-primary" type="button">🧾 Register this file as a certificate</button>
      <button id="act-verify" class="btn btn-ghost" type="button">✅ Verify this file</button>
    </div>
  </div>`;
  $('#act-register').onclick = () => { fillHash(a.sha256, `From analyzer: ${a.name}`); if (!$('#f-title').value) $('#f-title').value = a.name.replace(/\.[^.]+$/, ''); show('register'); };
  $('#act-verify').onclick = () => { verifyHash(a.sha256, `File “${a.name}”`, 'Document file'); show('verify'); };
}
wireDrop($('#dropzone'), $('#file-input'), analyzeFile);



show('analyzer', false);
</script>
</body>
</html>
